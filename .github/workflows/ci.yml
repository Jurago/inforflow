name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Go test
        working-directory: collector
        run: go test ./...
      - name: Go build
        working-directory: collector
        run: go build -o /tmp/inforflow-collector .
      - name: Rust build
        working-directory: server
        run: cargo build --release
      - name: Smoke script
        run: bash scripts/healthcheck.sh || true
