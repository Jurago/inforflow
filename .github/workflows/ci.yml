name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Go test
        working-directory: collector
        run: go test ./...
      - name: Go build
        working-directory: collector
        run: go build -o /tmp/inforflow-collector .
      - name: Rust build
        working-directory: server
        run: cargo build --release
      - name: Smoke script
        run: bash -n scripts/healthcheck.sh && bash -n scripts/backup-local.sh && bash -n start.sh
      - name: Verify UI assets referenced by layout
        run: |
          set -e
          test -s static/js/inforflow.js
          test -s static/js/dashboard.js
          test -s static/js/auth.js
          while read -r js; do
            test -s "static/js/$js"
          done < <(grep -oE 'static/js/[a-z0-9_]+\.js' server/src/pages/layout.rs | sed 's|static/js/||' | sort -u)
